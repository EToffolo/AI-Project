[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g2metric-mm845"
version = "0.1.0"
description = "Learning the metric induced by a positive G2 three-form"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pypdf>=5", "pymupdf>=1.24"]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10", "nbconvert>=7"]

[project.scripts]
g2metric = "g2metric.__main__:main"

[tool.setuptools.packages.find]
include = ["g2metric*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
